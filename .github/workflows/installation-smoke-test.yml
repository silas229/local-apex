name: Installation smoke test

on:
  push:
    paths:
      - '.github/workflows/installation-smoke-test.yml'
      - 'compose.yml'
      - 'README.md'
      - 'setup/**'
  pull_request:
    paths:
      - '.github/workflows/installation-smoke-test.yml'
      - 'compose.yml'
      - 'README.md'
      - 'setup/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Free disk space for Oracle images and database
        run: |
          sudo rm -rf /usr/local/lib/android/sdk /usr/share/dotnet /opt/ghc
          df -h /

      - name: Log in to Oracle Container Registry
        uses: docker/login-action@v3
        with:
          registry: container-registry.oracle.com
          username: ${{ secrets.ORACLE_REGISTRY_USERNAME }}
          password: ${{ secrets.ORACLE_REGISTRY_AUTH_TOKEN }}

      - name: Prepare APEX and database environment
        shell: bash
        run: |
          cp setup/ords.env.example setup/ords.env
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/apex.zip" \
            https://download.oracle.com/otn_software/apex/apex_26.2.zip
          echo '50e27e5451435aa79205acbcd22ee44353d36d96768634695eb01b93fa02d782  '"$RUNNER_TEMP/apex.zip" \
            | sha256sum --check
          unzip -q "$RUNNER_TEMP/apex.zip" -d setup
          test -f setup/apex/apexins.sql
          chmod -R a+rwX setup/apex

      - name: Start and wait for healthy services
        run: docker compose up -d --wait --wait-timeout 4500

      - name: Verify ORDS responds
        run: >-
          curl --fail --silent --show-error --retry 5 --retry-connrefused
          --retry-delay 10 --max-time 30 --output /dev/null
          http://localhost:8080/ords/

      - name: Show service status and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail=200

      - name: Remove test stack
        if: always()
        run: docker compose down --volumes --remove-orphans